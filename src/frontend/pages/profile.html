<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.profile"></title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<a href="../index.html" class="back-link" data-i18n="nav.main"></a>

<!-- ═══════ ДОДАЄМО ШАПКУ ОСЬ ТУТ ═══════ -->    
<header class="site-header">
    <div class="header-right">
        <div id="guestNav" style="display: none;">
            <a href="login.html" data-i18n="nav.login"></a>
            <a href="register.html" data-i18n="nav.register"></a>
        </div>

        <!-- Блок для авторизованих -->
        <div id="authNav" style="display: none;">
            <a href="profile.html" data-i18n="nav.profile"></a>
            <a href="#" id="logoutBtn" data-i18n="nav.logout"></a>
        </div>
    </div>
</header>

<div class="content">
    <div class="lang-switch"> <!-- Додавання шторки -->
        <button class="lang-toggle" onclick="toggleLangMenu()">
            <span id="currentLang">🌐</span> ▼
        </button>
        <div class="lang-menu" id="langMenu">
             <button onclick="setLang('uk')">
                 <img src="https://flagcdn.com/24x18/ua.png" alt=""> Українська
            </button>
            <button onclick="setLang('en')">
                  <img src="https://flagcdn.com/24x18/gb.png" alt=""> English
            </button>
        </div>
    </div>
    
    <!-- Сам профіль -->
    <!-- ГОЛОВНИЙ КОНТЕЙНЕР ПРОФІЛЮ -->
    <div class="profile-container">

        <!-- ЛІВА ПАНЕЛЬ (Вкладки) -->
        <aside class="profile-sidebar">
            <div class="user-brief">
                <img id="sidebarAvatar" src="https://via.placeholder.com/10" alt="Avatar" class="avatar-preview">
                <h2 id="sidebarUsername" data-i18n="profile.loading"></h2>
            </div>

            <nav class="profile-nav">
                <button class="nav-btn active" data-tab="tab-general">📝 <span data-i18n="profile.general"></span></button>
                <button class="nav-btn" data-tab="tab-security">🔒 <span data-i18n="profile.security"></span></button>
                <button class="nav-btn" data-tab="tab-avatar">🖼️ <span data-i18n="profile.avatar"></span></button>
                <button class="nav-btn" id="adminTabBtn" data-tab="tab-admin" style="display: none;">🛡️ <span data-i18n="admin.admin"></span></button>
            </nav>
        </aside>

        <!-- ПРАВА ПАНЕЛЬ (Контент) -->
        <main class="profile-content">

            <!-- Вкладка 1: Загальні -->
            <div id="tab-general" class="tab-pane active">
                <h3 data-i18n="profile.info0"></h3>
                <form id="generalForm">
                    <div class="form-group">
                        <label for="profileUsername" data-i18n="profile.username"></label>
                        <input type="text" id="profileUsername" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="profileEmail" data-i18n="profile.email"></label>
                        <input type="text" id="profileEmail" name="email" required>
                    </div>
                    <button type="submit" class="btn-primary" data-i18n="profile.save_change"></button>
                </form>
            </div>

            <!-- Вкладка 2: Безпека -->
            <div id="tab-security" class="tab-pane">
                <h3 data-i18n="reset.change"></h3>
                <form id="securityForm">
                    <div class="form-group">
                        <label for="currentPassword" data-i18n="profile.current_password"></label>
                        <div class="password-wrapper">
                            <input type="password" id="currentPassword" name="current_password" required>
                            <span class="toggle-password" onclick="togglePassword('currentPassword', this)">👁️</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="newPassword" data-i18n="reset.new_password"></label>
                        <div class="password-wrapper">
                            <input type="password" id="newPassword" name="new_password" required>
                            <span class="toggle-password" onclick="togglePassword('newPassword', this)">👁️</span>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" data-i18n="reset.change"></button>
                </form>
            </div>

            <!-- Вкладка 3: Аватар -->
            <div id="tab-avatar" class="tab-pane">
                <h3 data-i18n="profile.change_avatar"></h3>
                <div class="avatar-upload-area">
                    <img id="mainAvatar" src="https://via.placeholder.com/150" alt="Avatar" class="avatar-large">

                    <br>
                    <input type="file" id="avatarInput" accept="image/*" style="display: none">
                    <button type="button" class="btn-primary" onclick="document.getElementById('avatarInput').click()" data-i18n="profile.file"></button>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
