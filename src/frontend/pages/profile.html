<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="profile-title">Мій профіль</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<a href="../index.html" class="back-link" data-i18n="button-back"></a>

<!-- ═══════ ДОДАЄМО ШАПКУ ОСЬ ТУТ ═══════ -->    
<header class="site-header">
    <div class="header-right">
        <div id="guestNav" style="display: none;">
            <a href="login.html" data-i18n="auth-login"></a>
            <a href="register.html" data-i18n="auth-register"></a>
        </div>

        <!-- Блок для авторизованих -->
        <div id="authNav" style="display: none;">
            <a href="profile.html" data-i18n="nav-profile">Мій профіль</a>
            <a href="#" id="logoutBtn" data-i18n="nav-logout">Вийти</a>
        </div>
    </div>
</header>

<div class="content">
    <div class="lang-switch"> <!-- Додавання шторки -->
        <button class="lang-toggle" onclick="toggleLangMenu()">
            <span id="currentLang">🌐</span> ▼
        </button>
        <div class="lang-menu" id="langMenu">
             <button onclick="setLang('uk')">
                 <img src="https://flagcdn.com/24x18/ua.png" alt=""> Українська
            </button>
            <button onclick="setLang('en')">
                  <img src="https://flagcdn.com/24x18/gb.png" alt=""> English
            </button>
        </div>
    </div>

    <!-- ГОЛОВНИЙ КОНТЕЙНЕР ПРОФІЛЮ -->
    <div class="profile-container">

        <!-- ЛІВА ПАНЕЛЬ (Вкладки) -->
        <aside class="profile-sidebar">
            <div class="user-brief">
                <img id="sidebarAvatar" src="https://via.placeholder.com/10" alt="Avatar" class="avatar-preview">
                <h2 id="sidebarUsername">Завантаження</h2>
            </div>
            <nav class="profile-nav">
                <button class="nav-btn active" data-tab="tab-general">📝 Загальні</button>
                <button class="nav-btn" data-tab="tab-security">🔒 Безпека</button>
                <button class="nav-btn" data-tab="tab-avatar">🖼️ Аватар</button>
            </nav>
        </aside>

        <!-- ПРАВА ПАНЕЛЬ (Контент) -->
        <main class="profile-content">

            <!-- Вкладка 1: Загальні -->
            <div id="tab-general" class="tab-pane active">
                <h3>Загальна інформація</h3>
                <form id="generalForm">
                    <div class="form-group">
                        <label for="profileUsername">Ім'я користувача</label>
                        <input type="text" id="profileUsername" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="profileEmail">Email</label>
                        <input type="text" id="profileEmail" name="email" required>
                    </div>
                    <button type="submit" class="btn-primary">Зберегти зміни</button>
                </form>
            </div>

            <!-- Вкладка 2: Безпека -->
            <div id="tab-security" class="tab-pane">
                <h3>Зміна паролю</h3>
                <form id="securityForm">
                    <div class="form-group">
                        <label for="currentPassword">Поточний пароль</label>
                        <input type="password" id="currentPassword" name="current_password" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Новий пароль</label>
                        <input type="password" id="newPassword" name="new_password" required>
                    </div>
                    <button type="submit" class="btn-primary">Оновити пароль</button>
                </form>
            </div>

            <!-- Вкладка 3: Аватар -->
            <div id="tab-avatar" class="tab-pane">
                <h3>Зміна аватара</h3>
                <div class="avatar-upload-area">
                    <img id="mainAvatar" src="https://via.placeholder.com/150" alt="Avatar" class="avatar-large">

                    <br>
                    <input type="file" id="avatarInput" accept="image/*" style="display: none">
                    <button type="button" class="btn-primary" onclick="document.getElementById('avatarInput').click()">Обрати файл</button>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
