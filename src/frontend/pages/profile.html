<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="profile-title">Мій профіль</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<a href="../index.html" class="back-link" data-i18n="button-back"></a>

<div class="content">
    <div class="lang-switch"> <!-- Додавання шторки -->
        <button class="lang-toggle" onclick="toggleLangMenu()">
            <span id="currentLang">🌐</span> ▼
        </button>
        <div class="lang-menu" id="langMenu">
             <button onclick="setLang('uk')">
                 <img src="https://flagcdn.com/24x18/ua.png" alt=""> Українська
            </button>
            <button onclick="setLang('en')">
                  <img src="https://flagcdn.com/24x18/gb.png" alt=""> English
            </button>
        </div>
    </div>

    <!-- ГОЛОВНИЙ КОНТЕЙНЕР ПРОФІЛЮ -->
    <div class="profile-container">

        <!-- ЛІВА ПАНЕЛЬ (Вкладки) -->
        <aside class="profile-sidebar">
            <div class="user-brief">
                <img id="sidebarAvatar" src="https://via.placeholder.com/10" alt="Avatar" class="avatar-preview">
                <h2 id="sidebarUsername">Завантаження</h2>
            </div>
            <nav class="profile-nav">
                <button class="nav-btn active" data-tab="tab-general">📝 Загальні</button>
                <button class="nav-btn" data-tab="tab-security">🔒 Безпека</button>
                <button class="nav-btn" data-tab="tab-avatar">🖼️ Аватар</button>
            </nav>
        </aside>

        <!-- ПРАВА ПАНЕЛЬ (Контент) -->
        <main class="profile-content">

            <!-- Вкладка 1: Загальні -->
            <div id="tab-general" class="tab-panel active">
                <h3>Загальна інформація</h3>
                <form id="generalForm">
                    <div class="form-group">
                        <label for="profileUsername">Ім'я користувача</label>
                        <input type="text" id="profileUsername" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="profileEmail">Email</label>
                        <input type="text" id="profileEmail" name="email" required>
                    </div>
                    <button type="submit" class="btn-primary">Зберігти зміни</button>
                </form>
            </div>

            <!-- Вкладка 2: Безпека -->
        </main>
    </div>
</div>

</body>
</html>
