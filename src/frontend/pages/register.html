<!DOCTYPE html>

<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="reg-title">Реєстрація</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
<a href="../index.html" class="back-link" data-i18n="button-back"></a>

<div class="content"> <!-- Контейнер, в якому лежить контент сторінки(текст) -->
    <div class="lang-switch"> <!-- Додавння шторки -->
        <button class="lang-toggle" onclick="toggleLangMenu()">
            <span id="currentLang">🌐</span> ▼
        </button>
        <div class="lang-menu" id="langMenu">
             <button onclick="setLang('uk')">
                 <img src="https://flagcdn.com/24x18/ua.png" alt=""> Українська
            </button>
            <button onclick="setLang('en')">
                  <img src="https://flagcdn.com/24x18/gb.png" alt=""> English
        </button>
    </div>
</div>

    <div class="auth-form">
        <h1 data-i18n="reg-title"></h1>
            <form id="registerForm">
            <div class="form-group">
                <label data-i18n="reg-username"></label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label data-i18n="reg-email"></label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label data-i18n="reg-password"></label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" data-i18n="reg-submit"></button>
            <p class="auth-link">
                <span data-i18n="reg-has-account"></span>
                <a href="login.html" data-i18n="reg-login-link"></a>
            </p>
        </form>
    </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
