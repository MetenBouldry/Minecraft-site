<!DOCTYPE html>

<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.register"></title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
<a href="../index.html" class="back-link" data-i18n="nav.main"></a>

<!-- ═══════ ДОДАЄМО ШАПКУ ОСЬ ТУТ ═══════ -->    
<header class="site-header">
    <div class="header-right">
        <div id="guestNav" style="display: none;">
            <a href="login.html" data-i18n="nav.login"></a>
            <a href="register.html" data-i18n="nav.register"></a>
        </div>

        <!-- Блок для авторизованих -->
        <div id="authNav" style="display: none;">
            <a href="profile.html" data-i18n="nav.profile"></a>
            <a href="#" id="logoutBtn" data-i18n="nav.logout"></a>
        </div>
    </div>
</header>

<div class="content"> <!-- Контейнер, в якому лежить контент сторінки(текст) -->
    <div class="lang-switch"> <!-- Додавання шторки -->
        <button class="lang-toggle" onclick="toggleLangMenu()">
            <span id="currentLang">🌐</span> ▼
        </button>
        <div class="lang-menu" id="langMenu">
             <button onclick="setLang('uk')">
                 <img src="https://flagcdn.com/24x18/ua.png" alt=""> Українська
            </button>
            <button onclick="setLang('en')">
                  <img src="https://flagcdn.com/24x18/gb.png" alt=""> English
            </button>
        </div>
    </div>

        <!-- Сама реєстрація -->
    <div class="auth-form">
        <h1 data-i18n="reg.title"></h1>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username" data-i18n="reg.user"></label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email" data-i18n="reg.email"></label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password" data-i18n="reg.password"></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required>
                        <span class="toggle-password" onclick="togglePassword('password', this)">👁️</span>
                    </div>
                </div>

                <button type="submit" data-i18n="reg.submit"></button>
                <p class="auth-link">
                    <span data-i18n="reg.has_account"></span>
                    <a href="login.html" data-i18n="reg.login"></a>
                </p>
            </form>
    </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
