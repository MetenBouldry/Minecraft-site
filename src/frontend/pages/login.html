<!DOCTYPE html>

<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login-title">Вхід</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<a href="../index.html" class="back-link" data-i18n="button-back"></a>
        
<div class="content"> <!-- Контейнер, в якому лежить контент сторінки(текст) -->
    <div class="lang-switch"> <!-- Додавння шторки -->
        <button class="lang-toggle" onclick="toggleLangMenu()">
            <span id="currentLang">🌐</span> ▼
        </button>
        <div class="lang-menu" id="langMenu">
             <button onclick="setLang('uk')">
                 <img src="https://flagcdn.com/24x18/ua.png" alt=""> Українська
            </button>
            <button onclick="setLang('en')">
                  <img src="https://flagcdn.com/24x18/gb.png" alt=""> English
            </button>
        </div>
    </div>

    <div class="auth-form">
        <h1 data-i18n="login-title"></h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginUsername" data-i18n="login-username"></label>
                <input type="text" id="loginUsername" name="username" required>
            </div>
            <div class="form-group">
                <label for="loginPassword" data-i18n="login-password"></label>
                <input type="password" id="loginPassword" name="password" required>
            </div>
            <button type="submit" data-i18n="login-submit"></button>
            <p class="auth-link">
                <span data-i18n="login-no-account"></span>
                <a href="register.html" data-i18n="login-register-link"></a>
            </p>
        </form>
    </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
