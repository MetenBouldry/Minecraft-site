<!DOCTYPE html>

<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.admin"></title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<a href="../index.html" class="back-link" data-i18n="nav.main"></a>

<!-- ═══════ ДОДАЄМО ШАПКУ ОСЬ ТУТ ═══════ -->    
<header class="site-header">
    <div class="header-right">
        <div id="guestNav" style="display: none;">
            <a href="login.html" data-i18n="nav.login"></a>
            <a href="register.html" data-i18n="nav.register"></a>
        </div>

        <!-- Блок для авторизованих -->
        <div id="authNav" style="display: none;">
            <a href="profile.html" data-i18n="nav.profile"></a>
            <a href="#" id="logoutBtn" data-i18n="nav.logout"></a>
        </div>
    </div>
</header>

<div class="content">
    <div class="lang-switch"> <!-- Додавання шторки -->
        <button class="lang-toggle" onclick="toggleLangMenu()">
            <span id="currentLang">🌐</span> ▼
        </button>
        <div class="lang-menu" id="langMenu">
             <button onclick="setLang('uk')">
                 <img src="https://flagcdn.com/24x18/ua.png" alt=""> Українська
            </button>
            <button onclick="setLang('en')">
                  <img src="https://flagcdn.com/24x18/gb.png" alt=""> English
            </button>
        </div>
    </div>

    <div class="auth-form" style="max-width: 900px; margin-top: 100px;">
        <h1 data-i18n="admin.title"></h1>
        <p data-i18n="admin.desc"></p>

        <div style="overflow-x: auto;">
            <table class="admin-table" id="userTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th data-i18n="profile.username"></th>
                        <th>Email</th>
                        <th data-i18n="admin.role"></th>
                        <th data-i18n="admin.actions"></th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Тут будуть дані з JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
