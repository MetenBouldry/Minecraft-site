<!DOCTYPE html>

<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.forgot_password"></title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<a href="../index.html" class="back-link" data-i18n="nav.main"></a>

<!-- ═══════ ДОДАЄМО ШАПКУ ОСЬ ТУТ ═══════ -->    
<header class="site-header">
    <div class="header-right">
        <div id="guestNav" style="display: none;">
            <a href="login.html" data-i18n="nav.login"></a>
            <a href="register.html" data-i18n="nav.register"></a>
        </div>

        <!-- Блок для авторизованих -->
        <div id="authNav" style="display: none;">
            <a href="profile.html" data-i18n="nav.profile"></a>
            <a href="#" id="logoutBtn" data-i18n="nav.logout"></a>
        </div>
    </div>
</header>

<div class="content"> <!-- Контейнер, в якому лежить контент сторінки(текст) -->
    <div class="lang-switch"> <!-- Додавання шторки -->
        <button class="lang-toggle" onclick="toggleLangMenu()">
            <span id="currentLang">🌐</span> ▼
        </button>
        <div class="lang-menu" id="langMenu">
             <button onclick="setLang('uk')">
                 <img src="https://flagcdn.com/24x18/ua.png" alt=""> Українська
            </button>
            <button onclick="setLang('en')">
                  <img src="https://flagcdn.com/24x18/gb.png" alt=""> English
            </button>
        </div>
    </div>

    <div class="auth-form">
        <h1 class="reset-title" data-i18n="reset.title"></h1>

        <!-- Форма 1: Введення Email -->
        <form id="forgotForm">
            <div class="form-group">
                <label for="resetEmail" data-i18n="reset.email"></label>
                <input type="email" id="resetEmail" required>
            </div>
            <button type="submit" data-i18n="reset.submit"></button>
            <p id="forgotMessage" class="reset-message"></p>
        </form>

        <!-- Форма 2: Введення токена та нового паролю -->
         <form id="resetForm">
            <div class="form-group">
                <label for="resetToken" data-i18n="reset.token"></label>
                <input type="text" id="resetToken" required>
            </div>
            <div class="form-group">
                <label for="newPasswordReset" data-i18n="reset.new_password"></label>
                <div class="password-wrapper">
                    <input type="password" id="newPasswordReset" required>
                    <span class="toggle-password" onclick="togglePassword('newPasswordReset', this)">👁️</span>
                </div>
            </div>
            <button type="submit" data-i18n="reset.change"></button>
         </form>
    </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
