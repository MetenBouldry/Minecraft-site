<!DOCTYPE html>

<html lang="uk"> <!-- Вказує на мову сайту -->

<head> <!-- Основа сайту, кодування, заголовок вкладки, підключення CSS,метадані для пошуку -->
    <meta charset="UTF-8"> <!-- Кодування символів -->

<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Вказує на те, що сайт адаптивний -->

    <title>Майнкрафт</title>

    <link rel="stylesheet" href="style.css"> <!-- Підключення CSS -->
</head>

<body> <!-- Видима частина,те що буде лежати на сторінці(наприклад текст) -->

<div class="content"> <!-- Контейнер, в якому лежить контент сторінки(текст) -->
    <div class="lang-switch"> <!-- Додавння шторки -->
        <button class="lang-toggle" onclick="toggleLangMenu()">
            <span id="currentLang">🌐</span> ▼
        </button>
        <div class="lang-menu" id="langMenu">
            <button onclick="setLang('uk')">
                <img src="https://flagcdn.com/24x18/ua.png" alt=""> Українська
            </button>
            <button onclick="setLang('en')">
                <img src="https://flagcdn.com/24x18/gb.png" alt=""> English
            </button>
        </div>
    </div>



    <h1 id="mainpage-title"></h1> <!-- id заголовка сторінки, який вимагає заповнення зі script(наступний такий же) файл lang -->

    <p class="server-info" id="server-info0">
        <span class="status-icon" id="status-tfg"></span> <!-- Іконка статусу -->
        <span id="mainpage-minecraftserver-info0"></span>    
        </p> <!-- id тексту файл lang -->

    <p class="server-info" id="server-info1">
        <span class="status-icon" id="status-vanila"></span>
        <span id="mainpage-minecraftserver-info1"></span>
    </p>
</div>

    <script src="script.js"></script> <!-- Підключення файлу -->
</body>
</html>
